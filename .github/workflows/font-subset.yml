name: Font Subsetting & Embed

on:
  push:
    branches: ["main", "master"]
    paths:
      - "web/index.html"
      - "scripts/subset_font.py"
      - "scripts/requirements.txt"
      - ".github/workflows/font-subset.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: font-subset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  subset-and-embed:
    name: Subset & embed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache the full Nebulove TTF
        uses: actions/cache@v6
        with:
          path: ~/.cache/nebulove
          key: nebulove-ttf-v1
          restore-keys: nebulove-ttf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Download Nebulove & subset the font
        run: python3 scripts/subset_font.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- web/index.html; then
            echo "web/index.html 没有变化，无需提交。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/index.html
            git commit -m "perf(web): 更新 Nebulove 字体子集"
            git push
          fi
